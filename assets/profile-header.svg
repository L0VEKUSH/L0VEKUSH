<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Lovekush Kumar — Computer Engineering</title>
  <desc id="desc">A dark navy gradient banner with cyan and violet accents.</desc>
  <defs>
